# SPDX-License-Identifier: Apache-2.0

name: Docker Build, Scan and Push to GHCR

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      dist_path:
        required: false
        type: string
        description: Path of the built dist/ inside the image to upload to S3 (leave empty to skip)

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.TOKEN_REGISTRY }}

      - name: Build image
        run: docker build -t ghcr.io/traipoap/${{ inputs.service }}:0.0.${{ github.run_number }} --build-arg VERSION=0.0.${{ github.run_number }} -f ${{ inputs.dockerfile }} .

      # Scan the LOCAL image BEFORE pushing — if the gate fails, the Push
      # step is skipped and no vulnerable image reaches the registry.
      # (trivy-action v0.36+ input schema: scan-type + scan-ref for local
      # images; `image`/`output-format`/`output-file` were removed)
      - name: Run Trivy vulnerability scanner (local image mode)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          scan-ref: ghcr.io/traipoap/${{ inputs.service }}:0.0.${{ github.run_number }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
          timeout: '10m'
          # Fail on known (fixable) CRITICAL findings → blocks the push.
          # Set exit-code: '0' to make this report-only.
          exit-code: '1'
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ inputs.service }}

      - name: Push image
        if: success()
        run: docker push ghcr.io/traipoap/${{ inputs.service }}:0.0.${{ github.run_number }}

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to AWS ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 \
            | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR }}

      - name: Tag image to AWS ECR
        if: success()
        run: docker tag ghcr.io/traipoap/${{ inputs.service }}:0.0.${{ github.run_number }} ${{ secrets.AWS_ECR }}/${{ inputs.service }}:0.0.${{ github.run_number }}

      - name: Push image to AWS ECR
        if: success()
        run: docker push ${{ secrets.AWS_ECR }}/${{ inputs.service }}:0.0.${{ github.run_number }}

      # --- Optional: upload the built dist/ from the image to S3 ---
      # Extract the dist directory straight from the scanned/pushed image so
      # the S3 copy is guaranteed to match the registry artifact.
      - name: Extract dist from image
        id: extract-dist
        if: success() && inputs.dist_path != ''
        run: |
          container_id=$(docker create ghcr.io/traipoap/${{ inputs.service }}:0.0.${{ github.run_number }})
          docker cp "${container_id}:${inputs.dist_path}" dist-upload
          docker rm "${container_id}"
          test -d dist-upload || { echo "::error::${{ inputs.dist_path }} not found in image"; exit 1; }

      # Only run if the extract step actually succeeded — a *skipped*
      # extract (no dist_path) must not trigger this step either.
      - name: Upload dist to AWS S3
        if: steps.extract-dist.outcome == 'success' && github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_S3_REGION }}
        run: aws s3 cp dist-upload "s3://${{ secrets.AWS_S3_BUCKET }}/${{ inputs.service }}/0.0.${{ github.run_number }}/" --recursive
