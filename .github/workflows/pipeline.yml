# Pipeline: security gate (Gitleaks + SonarQube) → per-service build
# (only changed paths) via the reusable build-and-push.yml
# (build → Trivy gate → push GHCR, ECR [backend] / S3 [frontend]).
#
# Config (Settings → Secrets and variables → Actions):
#   Variable : SONAR_HOST_URL
#   Secret   : SONAR_TOKEN
#   Secret   : TOKEN_REGISTRY  (GHCR fine-grained PAT)
#   Project key: committed sonar-project.properties (not a secret)

name: Pipeline (Security → Build → Trivy → Push)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - '.github/workflows/**'
  pull_request:

  # Manual trigger: (re)build on demand (e.g. when a run was skipped by the path filter).
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build backend + frontend even if their paths did not change'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# No top-level permissions on purpose: a caller-level block would cap the
# reusable build workflow (it needs packages/security-events: write).

jobs:
  changes:
    name: Detect changed service
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Path filters
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker/backend/**'
            frontend:
              - 'frontend/**'
              - 'docker/frontend/**'

  gitleaks:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # scan full history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # publish SARIF to the Security tab
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: SonarQube — code quality & security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # inline findings on PRs
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for new-code analysis

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          # Server/auth from repo Variable/Secret; project key in the committed sonar-project.properties
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_ARGS: '-Dproject.settings=./sonar-project.properties'
          # Fail on new security issues — makes the gate meaningful
          SONAR_QUALITY_GATE: 'true'

  build-backend:
    name: Backend — build, Trivy scan, push
    # Skipped if the security gate (gitleaks/sonarqube) failed.
    needs: [changes, gitleaks, sonarqube]
    if: >-
      needs.changes.outputs.backend == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_build == 'true')
    uses: ./.github/workflows/build-and-push.yml
    with:
      service: backend
      dockerfile: ./docker/backend/Dockerfile
    secrets: inherit

  build-frontend:
    name: Frontend — build, Trivy scan, push
    # Skipped if the security gate (gitleaks/sonarqube) failed.
    needs: [changes, gitleaks, sonarqube]
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_build == 'true')
    uses: ./.github/workflows/build-and-push.yml
    with:
      service: frontend
      dockerfile: ./docker/frontend/Dockerfile
      # Runtime (nginx) image serves /usr/share/nginx/html; /app/dist is builder-only.
      dist_path: /usr/share/nginx/html
    secrets: inherit
