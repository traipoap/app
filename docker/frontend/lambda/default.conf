# LAMBDA ONLY (use --build-arg LAMBDA=true)
# The filesystem is read-only except /tmp, so no directive here may
# point logs/writes at /var/log or /var/lib (see nginx.conf).
server {
    # Served on 4321 — the Lambda adapter targets port 4321 inside the container.
    listen       4321;
    server_name  localhost;

    # /var/log/nginx is not writable on Lambda — the adapter already
    # streams request logs to CloudWatch via stdout.
    access_log  off;
    error_log   /tmp/error.log warn;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
