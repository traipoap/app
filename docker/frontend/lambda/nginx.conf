# nginx main context — LAMBDA ONLY (use --build-arg LAMBDA=true)
#
# On Lambda the container filesystem is READ-ONLY except /tmp, so every
# path nginx *writes* to must live under /tmp. The stock nginx:alpine
# config writes to /run (pid), /var/log/nginx (logs) and /var/lib/nginx
# (temp paths) — all of those fail on Lambda:
#   - pid open failure          → fatal at startup
#   - access_log open failure   → fatal at config parse
#   - temp path create failure  → fatal at startup
#
# Serving (root /usr/share/nginx/html) is read-only → fine as-is.

user  nginx nginx;
worker_processes  5;  # Default

error_log  /tmp/error.log warn;

pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Requests are already logged by the lambda adapter (stdout → CloudWatch),
    # and /var/log/nginx is not writable on Lambda.
    access_log  off;

    sendfile             on;
    tcp_nopush           on;
    keepalive_timeout    65;

    # nginx creates these on demand — must be writable (only /tmp is).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
